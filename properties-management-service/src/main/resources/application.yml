spring:
  application:
    name: properties-management-svc

  data:
    mongodb:
      database: ${PROPERTIES_DB:acma}
      host: ${PROPERTIES_DB_HOST:localhost}
      port: ${PROPERTIES_DB_PORT:27017}
      auto-index-creation: true
      
  security:
     oauth2:
       resourceserver:
            jwt:
              issuer-uri: http://127.0.0.1:4040/realms/acma
              jwk-set-uri: http://127.0.0.1:4040/realms/acma/protocol/openid-connect/certs


server:
  port: 7101
  
properties: 
  management: 
     collections: 
       name: ${PROPERTIES_COLLECTIONS_NAME:properties-management}
       
       
logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG

  

